services:
  api:
    build:
      context: .
    container_name: speech-transcription-api
    environment:
      STS_ENVIRONMENT: local
      STS_DOCS_ENABLED: "true"
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s